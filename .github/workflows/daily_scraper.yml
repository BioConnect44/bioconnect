name: Daily BioConnect AI Event Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every night at 00:00 UTC
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute AI Event Scraper Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python ai_event_scraper.py

      - name: Upload Scraped Events Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraped-events-backup
          path: scraped_events_backup.json
          retention-days: 7
