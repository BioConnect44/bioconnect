name: BioConnect Autonomous AI Jobs Scraper

on:
  schedule:
    # Run automatically every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧬 Run BioConnect Jobs Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OUTPUT_PATH: "public/jobs.json"
          SCRAPER_DB: "bioconnect_jobs.db"
        run: |
          python src/scraper.py || echo "Scraper finished with non-zero exit code"

      - name: 📤 Commit & Push Updated Jobs JSON
        run: |
          git config user.name "BioConnect Scraper Bot"
          git config user.email "bot@bioconnect.org"
          git add public/jobs.json
          git add bioconnect_jobs.db || true

          if git diff --staged --quiet; then
            echo "No new jobs found — skipping commit"
          else
            JOBS_COUNT=$(python -c "import json; print(json.load(open('public/jobs.json')).get('total', 0))" 2>/dev/null || echo "0")
            git commit -m "🧬 Auto-update: ${JOBS_COUNT} active biotech jobs [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]" || true
            git push origin main || echo "Git push skipped or clean"
            echo "✅ Synchronized ${JOBS_COUNT} active jobs"
          fi
