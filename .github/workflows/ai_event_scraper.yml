name: BioConnect Autonomous AI Event Scraper Workflow

on:
  schedule:
    # Run automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger on demand from GitHub Actions UI

jobs:
  scrape-and-sync-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic python-dotenv

      - name: Run BioConnect AI Event Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: "bioconnect-prod"
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BIOCONNECT_API_URL: ${{ secrets.BIOCONNECT_API_URL }}
        run: |
          python ai_event_scraper.py

      - name: Commit & Push Updated Scraped Events Backup
        run: |
          git config --global user.name 'BioConnect Scraper Bot'
          git config --global user.email 'bot@bioconnect.org'
          git add scraped_events_backup.json
          git diff-index --quiet HEAD || git commit -m "Auto-update scraped_events_backup.json with newly discovered deep-link biotech events [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
